name: Design Token Law

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - fn-*

jobs:
  token-law:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install guardrail tools
        run: |
          set -euo pipefail
          brew install ripgrep swiftlint

      - name: Run token-law grep guardrails
        run: bash scripts/token-law-guardrails.sh

      # token-law-guardrails.sh is a ratchet on *added lines* under four app
      # directories. premium-ui-guardrails.sh scans the whole tree instead, so
      # it catches drift that arrives by moving code rather than writing it —
      # and it was wired to no workflow at all, which is how the repo's two
      # worst glass violations came to sit inside the design-system directories
      # themselves.
      - name: Run premium clay and glass guardrails
        run: bash scripts/premium-ui-guardrails.sh

      - name: Enforce no direct print logging
        run: bash scripts/check-no-print-logs.sh

      # `swiftlint --strict` fails on 194 pre-existing token-law errors, so this
      # job was red on every PR and could not signal a regression. The baseline
      # gate holds that debt per rule and fails only when the counts change.
      - name: Enforce SwiftLint token-law debt baseline
        run: bash scripts/check-swiftlint-baseline.sh
