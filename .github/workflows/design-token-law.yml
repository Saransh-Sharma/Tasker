name: Design Token Law

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - fn-*

jobs:
  token-law:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install guardrail tools
        run: |
          set -euo pipefail
          brew install ripgrep swiftlint

      - name: Run token-law grep guardrails
        run: bash scripts/token-law-guardrails.sh

      - name: Enforce no direct print logging
        run: bash scripts/check-no-print-logs.sh

      # `swiftlint --strict` fails on 194 pre-existing token-law errors, so this
      # job was red on every PR and could not signal a regression. The baseline
      # gate holds that debt per rule and fails only when the counts change.
      - name: Enforce SwiftLint token-law debt baseline
        run: bash scripts/check-swiftlint-baseline.sh
