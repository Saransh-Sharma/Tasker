name = "eva-cloud-development"
main = "src/worker.ts"
compatibility_date = "2026-08-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[secrets]
required = ["OPENAI_API_KEY", "APPLE_TEAM_ID", "APPLE_KEY_ID", "APPLE_PRIVATE_KEY_P8", "APPLE_CLIENT_IDS", "APPLE_ROOT_CERTIFICATES_BASE64", "ACCOUNT_HMAC_KEY", "SESSION_SIGNING_PRIVATE_KEY", "TOKEN_ENCRYPTION_KEY", "CONFIG_SIGNING_PRIVATE_KEY", "APP_ATTEST_ENVIRONMENT"]

[vars]
ENVIRONMENT = "development"
EVA_API_VERSION = "1"
MINIMUM_CLIENT_VERSION = "1.0.0"
MIN_RUNTIME_CONFIG_VERSION = "1"
DAILY_BUDGET_MICRO_USD = "10000000"
ACCOUNT_COST_FUSE_MICRO_USD = "5000000"
APPLE_BUNDLE_IDS = "com.saransh1337.To-Do-List,com.saransh1337.To-Do-List.mac"
APPLE_CATALYST_BUNDLE_ID = "com.saransh1337.To-Do-List.mac"
APPLE_APP_ID = "1574046107"
APP_STORE_ENVIRONMENT = "Xcode"

[[durable_objects.bindings]]
name = "AUTH_CHALLENGES"
class_name = "AuthChallengeDO"

[[durable_objects.bindings]]
name = "EVA_ACCOUNTS"
class_name = "EvaAccountDO"

[[durable_objects.bindings]]
name = "GLOBAL_BUDGET"
class_name = "GlobalBudgetDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthChallengeDO", "EvaAccountDO", "GlobalBudgetDO"]

[[kv_namespaces]]
binding = "EVA_CONFIG"
id = "55aa2e432df84dc8b490e0f05c262001"

[[ratelimits]]
name = "EDGE_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "CONFIG_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "AUTH_CHALLENGE_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "APPLE_EXCHANGE_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "GUEST_BOOTSTRAP_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 5, period = 60 }

[[analytics_engine_datasets]]
binding = "EVA_ANALYTICS"
dataset = "eva_cloud_development"

[env.staging]
name = "eva-cloud-staging"
workers_dev = true

[env.staging.secrets]
required = ["OPENAI_API_KEY", "APPLE_TEAM_ID", "APPLE_KEY_ID", "APPLE_PRIVATE_KEY_P8", "APPLE_CLIENT_IDS", "APPLE_ROOT_CERTIFICATES_BASE64", "ACCOUNT_HMAC_KEY", "SESSION_SIGNING_PRIVATE_KEY", "TOKEN_ENCRYPTION_KEY", "CONFIG_SIGNING_PRIVATE_KEY", "APP_ATTEST_ENVIRONMENT"]

[env.staging.vars]
ENVIRONMENT = "staging"
EVA_API_VERSION = "1"
MINIMUM_CLIENT_VERSION = "1.0.0"
MIN_RUNTIME_CONFIG_VERSION = "1"
DAILY_BUDGET_MICRO_USD = "50000000"
ACCOUNT_COST_FUSE_MICRO_USD = "5000000"
APPLE_BUNDLE_IDS = "com.saransh1337.To-Do-List,com.saransh1337.To-Do-List.mac"
APPLE_CATALYST_BUNDLE_ID = "com.saransh1337.To-Do-List.mac"
APPLE_APP_ID = "1574046107"
APP_STORE_ENVIRONMENT = "Sandbox"

[[env.staging.durable_objects.bindings]]
name = "AUTH_CHALLENGES"
class_name = "AuthChallengeDO"

[[env.staging.durable_objects.bindings]]
name = "EVA_ACCOUNTS"
class_name = "EvaAccountDO"

[[env.staging.durable_objects.bindings]]
name = "GLOBAL_BUDGET"
class_name = "GlobalBudgetDO"

[[env.staging.kv_namespaces]]
binding = "EVA_CONFIG"
id = "0161b7d658364c69ab163a045a1cb9f3"

[[env.staging.ratelimits]]
name = "EDGE_RATE_LIMITER"
namespace_id = "1101"
simple = { limit = 60, period = 60 }

[[env.staging.ratelimits]]
name = "CONFIG_RATE_LIMITER"
namespace_id = "1102"
simple = { limit = 60, period = 60 }

[[env.staging.ratelimits]]
name = "AUTH_CHALLENGE_RATE_LIMITER"
namespace_id = "1103"
simple = { limit = 10, period = 60 }

[[env.staging.ratelimits]]
name = "APPLE_EXCHANGE_RATE_LIMITER"
namespace_id = "1104"
simple = { limit = 5, period = 60 }

[[env.staging.ratelimits]]
name = "GUEST_BOOTSTRAP_RATE_LIMITER"
namespace_id = "1105"
simple = { limit = 5, period = 60 }

[[env.staging.analytics_engine_datasets]]
binding = "EVA_ANALYTICS"
dataset = "eva_cloud_staging"

[env.production]
name = "eva-cloud-production"
workers_dev = false
routes = [{ pattern = "api.getlifeboard.app", custom_domain = true }]

[env.production.secrets]
required = ["OPENAI_API_KEY", "APPLE_TEAM_ID", "APPLE_KEY_ID", "APPLE_PRIVATE_KEY_P8", "APPLE_CLIENT_IDS", "APPLE_ROOT_CERTIFICATES_BASE64", "ACCOUNT_HMAC_KEY", "SESSION_SIGNING_PRIVATE_KEY", "TOKEN_ENCRYPTION_KEY", "CONFIG_SIGNING_PRIVATE_KEY", "APP_ATTEST_ENVIRONMENT"]

[env.production.vars]
ENVIRONMENT = "production"
EVA_API_VERSION = "1"
MINIMUM_CLIENT_VERSION = "1.0.0"
MIN_RUNTIME_CONFIG_VERSION = "1"
DAILY_BUDGET_MICRO_USD = "150000000"
ACCOUNT_COST_FUSE_MICRO_USD = "5000000"
APPLE_BUNDLE_IDS = "com.saransh1337.To-Do-List,com.saransh1337.To-Do-List.mac"
APPLE_CATALYST_BUNDLE_ID = "com.saransh1337.To-Do-List.mac"
APPLE_APP_ID = "1574046107"
